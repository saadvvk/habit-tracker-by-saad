name: habit_tracker_by_saad
description: "Habit Tracker by Saad — track your daily habits and streaks."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.6
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon_source.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon_source.png"
  adaptive_icon_background: "#4F46E5"
  adaptive_icon_foreground: "assets/app_icon_source.png"
  
