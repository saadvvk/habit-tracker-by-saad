workflows:
  android-workflow:
    name: Habit Tracker by Saad - Android
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Generate missing native Android project files
        script: flutter create --platforms=android .
      - name: Add INTERNET permission (missing by default in release builds)
        script: |
          grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml || \
          sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET"/>#' android/app/src/main/AndroidManifest.xml
      - name: Force-set compileSdk/targetSdk to avoid template gradle bugs
        script: |
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/' android/app/build.gradle || true
          sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 35/' android/app/build.gradle || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' android/app/build.gradle || true
      - name: Get Flutter packages
        script: flutter pub get
      - name: Generate app icons
        script: flutter pub run flutter_launcher_icons
      - name: Build AAB (Play Store release)
        script: flutter build appbundle --release
      - name: Build APK (for direct install/testing)
        script: flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/*.apk
      
