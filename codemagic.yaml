workflows:
  android-workflow:
    name: Habit Tracker by Saad - Android
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Generate missing native Android project files
        script: flutter create --platforms=android .
      - name: Add INTERNET permission (missing by default in release builds)
        script: |
          python3 -c "
          import re
          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path) as f:
              content = f.read()
          if 'android.permission.INTERNET' not in content:
              content = re.sub(
                  r'(<manifest[^>]*>)',
                  r'\1\n    <uses-permission android:name=\"android.permission.INTERNET\"/>',
                  content,
                  count=1
              )
              with open(path, 'w') as f:
                  f.write(content)
          "
      - name: Force-set compileSdk/targetSdk to avoid template gradle bugs
        script: |
          python3 -c "
          path = 'android/app/build.gradle'
          with open(path) as f:
              content = f.read()
          content = content.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 35')
          content = content.replace('targetSdkVersion flutter.targetSdkVersion', 'targetSdkVersion 35')
          content = content.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 21')
          with open(path, 'w') as f:
              f.write(content)
          "
      - name: Get Flutter packages
        script: flutter pub get
      - name: Generate app icons
        script: flutter pub run flutter_launcher_icons
      - name: Build AAB (Play Store release)
        script: flutter build appbundle --release
      - name: Build APK (for direct install/testing)
        script: flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/*.apk
      
